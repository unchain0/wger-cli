name: CI
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  checks: write
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53be808477a8d4b2c8aa4d8d4a3e7f1d5e3e8e2b5b6f0718 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable # v1.0.0
        with: components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2 # v2.7.8
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings --enable pedantic
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53be808477a8d4b2c8aa4d8d4a3e7f1d5e3e8e2b5b6f0718
      - uses: dtolnay/rust-toolchain@stable
        with: components: clippy, rustfmt
      - run: cargo build --all-targets
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, types]
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53be808477a8d4b2c8aa4d8d4a3e7f1d5e3e8e2b5b6f0718
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo tarpaulin --out Xml --out Html --run-types Tests --timeout 120
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53be808477a8d4b2c8aa4d8d4a3e7f1d5e3e8e2b5b6f0718
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit || true
      - run: cargo audit
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53be808477a8d4b2c8aa4d8d4a3e7f1d5e3e8e2b5b6f0718
      - uses: gitleaks/gitleaks@v8.18.2 # v8.18.2
        with:
          config-path: .gitleaks.toml
          args: detect --source . --verbose --redact
